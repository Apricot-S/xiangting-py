# This file is based on output generated by maturin v1.11.5.
# To regenerate the build matrix, run
#
#    maturin generate-ci github
#
# Then rename the generated workflow to distributions.yml and restore the build
# triggers below.
name: Build, test, and release distributions

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
        python: &python-versions
          - interpreter: "3.10"
            setup: "3.10"
          - interpreter: "3.11"
            setup: "3.11"
          - interpreter: "3.12"
            setup: "3.12"
          - interpreter: "3.13"
            setup: "3.13"
          - interpreter: "3.14"
            setup: "3.14"
          - interpreter: "3.14t"
            setup: "3.14t"
          - interpreter: pypy3.11
            setup: pypy3.11
          - interpreter: graalpy3.12
            setup: graalpy-25.2
          - interpreter: graalpy3.13
            setup: graalpy-25.3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.setup }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python.interpreter }}
          sccache: 'true'
          manylinux: auto
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Test wheel
        run: |
          uv sync --python python --no-default-groups --group test --no-install-project
          uv pip install --python .venv --reinstall dist/*.whl
          uv run --no-sync pytest
      - name: Upload wheels
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}-py${{ matrix.python.interpreter }}
          path: dist
          if-no-files-found: error

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
        python: *python-versions
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python.interpreter }}
          sccache: 'true'
          manylinux: musllinux_1_2
      - name: Test wheel
        if: >-
          ${{ !startsWith(matrix.python.interpreter, 'pypy') &&
          !startsWith(matrix.python.interpreter, 'graalpy') }}
        env:
          TEST_PYTHON_VERSION: ${{ matrix.python.interpreter }}
          TEST_ARCH: ${{ matrix.platform.target }}
        run: |
          case "$TEST_PYTHON_VERSION" in
            3.14t)
              python_abi=cp314-cp314t
              ;;
            *)
              python_tag="${TEST_PYTHON_VERSION//./}"
              python_abi="cp${python_tag}-cp${python_tag}"
              ;;
          esac

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            --env "PYTHON_ABI=$python_abi" \
            "quay.io/pypa/musllinux_1_2_${TEST_ARCH}" \
            /bin/sh -euxc '
              python="/opt/python/${PYTHON_ABI}/bin/python"

              "$python" -m venv /tmp/test-env
              /tmp/test-env/bin/python -m pip install \
                "pytest>=9.1.1,<10" \
                "pytest-benchmark>=5.2.3,<6" \
                "mahjong>=2.0.0"
              /tmp/test-env/bin/python -m pip install --force-reinstall \
                /io/dist/*.whl
              /tmp/test-env/bin/python -m pytest
            '
      - name: Upload wheels
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}-py${{ matrix.python.interpreter }}
          path: dist
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
        python: *python-versions
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.setup }}
          architecture: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python.interpreter }}
          sccache: 'true'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Test wheel
        shell: pwsh
        run: |
          uv sync --python python --no-default-groups --group test --no-install-project
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1 -ExpandProperty FullName
          uv pip install --python .venv --reinstall $wheel
          uv run --no-sync pytest
      - name: Upload wheels
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}-py${{ matrix.python.interpreter }}
          path: dist
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
        python: *python-versions
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.setup }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python.interpreter }}
          sccache: 'true'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Test wheel
        run: |
          uv sync --python python --no-default-groups --group test --no-install-project
          uv pip install --python .venv --reinstall dist/*.whl
          uv run --no-sync pytest
      - name: Upload wheels
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}-py${{ matrix.python.interpreter }}
          path: dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Test sdist
        run: |
          uv sync --python python --no-default-groups --group test --no-install-project
          uv pip install --python .venv --reinstall dist/*.tar.gz
          uv run --no-sync pytest
      - name: Upload sdist
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v10.0.1
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
