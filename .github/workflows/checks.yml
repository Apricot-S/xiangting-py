name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-features --locked

  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install lint dependencies
        run: >-
          uv sync
          --locked
          --no-default-groups
          --group lint
          --no-install-project
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Run Ruff
        run: uv run --no-sync ruff check .

  python-type:
    name: Python type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install type-checking dependencies
        run: >-
          uv sync
          --locked
          --no-default-groups
          --group typing
          --group test
          --no-install-project
      - name: Run ty
        run: uv run --no-sync ty check

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - uses: Swatinem/rust-cache@v2
      - name: Build and install project
        run: >-
          uv sync
          --locked
          --no-default-groups
          --group test
      - name: Run tests
        run: uv run --no-sync pytest
